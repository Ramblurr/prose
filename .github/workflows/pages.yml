name: Deploy Playground to Pages

on:
  check_suite:
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'check_suite' &&
       github.event.check_suite.app.slug == 'ol-nixbot' &&
       github.event.check_suite.head_branch == 'master' &&
       github.event.check_suite.conclusion == 'success')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: >-
            ${{
              github.event_name == 'check_suite' &&
              github.event.check_suite.head_sha ||
              github.sha
            }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
      - run: pnpm --dir playground install --frozen-lockfile --ignore-scripts
      - run: ./scripts/build.sh
        working-directory: playground
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: playground/dist
      - id: deployment
        uses: actions/deploy-pages@v5
