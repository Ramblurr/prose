<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prose Playground</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body data-signals="{workerReady: false, editorReady: false, workerState: 'initializing', workerStatus: 'Initializing…', workerStatusDetail: 'Starting the isolated render worker.', renderStatus: 'Waiting to render', resultView: 'preview', resultHeading: 'Preview', htmlResult: '', readerResult: '', evaluatedResult: '', diagnosticPhase: '', diagnosticMessage: ''}">
  <header class="app-header">
    <div>
      <p class="eyebrow">Prose</p>
      <h1>Playground</h1>
    </div>
    <div class="actions">
      <span id="worker-status" class="worker-status" data-state="initializing"
            data-attr-data-state="$workerState" data-text="$workerStatus">Initializing…</span>
      <label class="auto-control"><input id="auto-render" type="checkbox" checked> Auto</label>
      <button id="render" type="button"
              data-attr-disabled="!($workerReady && $editorReady)" disabled>Render</button>
    </div>
  </header>

  <main class="workspace">
    <section class="pane source-pane" aria-labelledby="source-heading">
      <div class="pane-heading">
        <div>
          <p class="eyebrow">Source</p>
          <h2 id="source-heading">Text and code</h2>
        </div>
      </div>
      <div class="editor-section">
        <h3 id="source-editor-label">Playground source</h3>
        <div id="source-editor" class="editor-shell" aria-busy="true"></div>
        <p class="editor-hint"><kbd>Cmd</kbd>/<kbd>Ctrl</kbd>+<kbd>Enter</kbd> renders explicitly.</p>
      </div>
      <section id="diagnostic" class="diagnostic"
               data-attr-hidden="!$diagnosticMessage" hidden>
        <strong data-text="$diagnosticPhase">Render</strong>
        <span data-text="$diagnosticMessage"></span>
      </section>
    </section>

    <section class="pane result-pane" aria-labelledby="result-heading">
      <div class="pane-heading result-heading">
        <div>
          <p class="eyebrow">Result</p>
          <h2 id="result-heading" data-text="$resultHeading">Preview</h2>
        </div>
        <span class="render-status" data-text="$renderStatus">Waiting to render</span>
      </div>

      <fieldset class="result-choices">
        <legend>Result view</legend>
        <label><input type="radio" name="result-view" value="preview" checked> Preview</label>
        <label><input type="radio" name="result-view" value="html"> HTML</label>
        <label><input type="radio" name="result-view" value="reader"> Reader</label>
        <label><input type="radio" name="result-view" value="evaluated"> Evaluated</label>
      </fieldset>

      <div class="result-shell">
        <section data-attr-hidden="$resultView !== 'preview'">
          <iframe id="preview" sandbox="" referrerpolicy="no-referrer"
                  title="Rendered HTML Preview"></iframe>
        </section>
        <section data-attr-hidden="$resultView !== 'html'" hidden>
          <pre id="html-result" data-text="$htmlResult"></pre>
        </section>
        <section data-attr-hidden="$resultView !== 'reader'" hidden>
          <pre id="reader-result" data-text="$readerResult"></pre>
        </section>
        <section data-attr-hidden="$resultView !== 'evaluated'" hidden>
          <pre id="evaluated-result" data-text="$evaluatedResult"></pre>
        </section>
      </div>
      <p id="worker-status-detail" class="status-detail"
         data-text="$workerStatusDetail">Starting the isolated render worker.</p>
    </section>
  </main>

  <script type="module" src="./assets/host.js"></script>
</body>
</html>
